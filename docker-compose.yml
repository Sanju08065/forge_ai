version: "3.9"

# ForgeAI — Local development stack
# Starts: DynamoDB Local, the task-management API, and the ForgeAI control plane
# Usage: docker compose up

services:

  # ── DynamoDB Local ─────────────────────────────────────────────────────────
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: forgeai-dynamodb
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/shell/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── DynamoDB table setup ───────────────────────────────────────────────────
  dynamodb-setup:
    image: amazon/aws-cli:latest
    container_name: forgeai-dynamodb-setup
    depends_on:
      dynamodb-local:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Creating ForgeAI DynamoDB table..."
        aws dynamodb create-table \
          --table-name forgeai-main \
          --attribute-definitions \
            AttributeName=PK,AttributeType=S \
            AttributeName=SK,AttributeType=S \
            AttributeName=GSI1PK,AttributeType=S \
            AttributeName=GSI1SK,AttributeType=S \
          --key-schema \
            AttributeName=PK,KeyType=HASH \
            AttributeName=SK,KeyType=RANGE \
          --billing-mode PAY_PER_REQUEST \
          --global-secondary-indexes '[
            {
              "IndexName": "GSI1",
              "KeySchema": [
                {"AttributeName":"GSI1PK","KeyType":"HASH"},
                {"AttributeName":"GSI1SK","KeyType":"RANGE"}
              ],
              "Projection": {"ProjectionType":"ALL"}
            }
          ]' \
          --endpoint-url http://dynamodb-local:8000 \
        && echo "Table created successfully" \
        || echo "Table may already exist — continuing"

  # ── ForgeAI API (the generated task-management app) ───────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: builder    # Use builder stage locally for faster rebuilds
    container_name: forgeai-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      DYNAMODB_TABLE_NAME: forgeai-main
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      JWT_SECRET: dev-secret-minimum-32-characters-long-for-local
      JWT_EXPIRY_SECONDS: "3600"
      CORS_ORIGIN: "http://localhost:5173"
    depends_on:
      dynamodb-setup:
        condition: service_completed_successfully
    command: ["node", "dist/server.js"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    develop:
      watch:
        - action: rebuild
          path: ./apps/api/src

  # ── ForgeAI Orchestrator ───────────────────────────────────────────────────
  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    container_name: forgeai-orchestrator
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: "3001"
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      DYNAMODB_TABLE_NAME: forgeai-main
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      FORGEAI_STATE_MACHINE_ARN: "arn:aws:states:us-east-1:123456789:stateMachine:forgeai-local"
      FORGEAI_EVENT_BUS_NAME: default
    depends_on:
      dynamodb-setup:
        condition: service_completed_successfully
    profiles: ["control-plane"]

  # ── Policy Gateway ─────────────────────────────────────────────────────────
  policy-gateway:
    build:
      context: .
      dockerfile: services/policy-gateway/Dockerfile
    container_name: forgeai-policy-gateway
    ports:
      - "3002:3002"
    environment:
      PORT: "3002"
      FORGEAI_ENVIRONMENT: development
    profiles: ["control-plane"]

  # ── ForgeAI Web Dashboard ──────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    container_name: forgeai-web
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3001
    depends_on:
      - orchestrator
    profiles: ["control-plane"]
    develop:
      watch:
        - action: sync
          path: ./apps/web/src
          target: /app/src

networks:
  default:
    name: forgeai-local
